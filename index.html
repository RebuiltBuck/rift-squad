:root {
  --bg: #14112a; --bg2: #1d1838; --panel: #26204a; --panel2: #2f2858; --line: #0b0918; --text: #f4f1ff; --mute: #a59fc9;
  --gold: #ffd23f; --gold2: #d99a00; --blue: #4fa3ff; --red: #ff4f6b; --green: #5fd068; --purple: #b36bff; --cyan: #4ff0ff;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Jersey', ui-monospace, monospace; font-size: 23px; line-height: 1.15; font-synthesis: none; font-variant-ligatures: none; letter-spacing: .02em; overscroll-behavior: none; }
/* pixel-art icons (16px art: shown at 16px or 32px so pixels stay square) */
img.ii { width: 16px !important; height: 16px !important; vertical-align: -2px; background: none !important; border: 0 !important; border-radius: 0 !important; margin: 0; }
img.ib { width: 32px !important; height: 32px !important; vertical-align: middle; background: none !important; border: 0 !important; border-radius: 0 !important; }
img.ih { width: 32px !important; height: 32px !important; vertical-align: -6px; } .hic { display: inline-flex; align-items: center; gap: 6px; }
.btn img.ii { width: 16px; height: 16px; } .btn img.ib { width: 32px; height: 32px; margin: -8px 0; }
#gear img.ib { margin: 0; }
body { -webkit-user-select: none; user-select: none; touch-action: manipulation; overflow: hidden; }
img, canvas.px { image-rendering: -webkit-optimize-contrast; image-rendering: pixelated; }
button { font-family: inherit; font-size: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font-family: inherit; }
.hidden { display: none !important; }

#app { position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg);
  background-image: radial-gradient(circle at 50% -10%, #3a2f7a 0%, transparent 55%); }
#topbar { display: flex; align-items: center; gap: 6px; padding: calc(8px + var(--sat)) 10px 8px; background: var(--bg2); border-bottom: 3px solid var(--line); }
.res { display: flex; align-items: center; gap: 4px; background: var(--line); border-radius: 6px; padding: 3px 8px 3px 4px; font-weight: 700; font-size: 23px; min-width: 0; }
.res img { width: 24px; height: 24px; }
.res.grow { flex: 1; }
#gear { width: 40px; height: 36px; border-radius: 6px; background: var(--panel2); box-shadow: inset 0 -3px 0 #0006; display: flex; align-items: center; justify-content: center; padding: 0; }
#screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 18px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
#tabs { display: flex; background: var(--bg2); border-top: 3px solid var(--line); padding-bottom: var(--sab); }
#tabs button { flex: 1; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 18px; color: var(--mute); position: relative; }
#tabs button img { width: 32px; height: 32px; opacity: .6; }
#tabs button.on { color: var(--text); background: linear-gradient(#ffffff10, transparent); }
#tabs button.on img { opacity: 1; transform: translateY(-2px) scale(1.12); }
.badge { position: absolute; top: 3px; right: calc(50% - 24px); background: var(--red); color: #fff; font-size: 17px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--line); }

.panel { background: var(--panel); border: 3px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 12px; box-shadow: inset 0 3px 0 #ffffff12, 0 3px 0 #0005; }
.panel h3 { margin: 0 0 8px; font-size: 26px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h3 small { font-size: 20px; color: var(--mute); font-weight: 400; }
.mute { color: #bdb7e0; } .small { font-size: 21px; } .tiny { font-size: 18px; }
.row { display: flex; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; gap: 6px; } .grow { flex: 1; min-width: 0; }
.center { text-align: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 8px; font-weight: 700; font-size: 22px;
  background: var(--blue); color: #fff; border: 3px solid var(--line); box-shadow: inset 0 -4px 0 #0004, inset 0 3px 0 #ffffff35; text-shadow: 0 2px 0 #0006; }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 #0004; }
.btn.gold { background: var(--gold); color: #3a2400; text-shadow: 0 1px 0 #fff6; }
.btn.green { background: var(--green); } .btn.red { background: var(--red); } .btn.purple { background: var(--purple); } .btn.gray { background: #5a5480; }
.btn[disabled], .btn.off { filter: grayscale(.85) brightness(.75); pointer-events: none; }
.btn.big { font-size: 34px; padding: 14px 20px; border-radius: 12px; letter-spacing: 1px; }
.btn.sm { padding: 6px 10px; font-size: 20px; border-width: 2px; }
.btn img { width: 16px; height: 16px; }
.full { width: 100%; }

.bar { height: 16px; background: var(--line); border-radius: 6px; overflow: hidden; position: relative; border: 2px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--green); box-shadow: inset 0 -3px 0 #0003, inset 0 2px 0 #fff4; }
.bar.gold > i { background: var(--gold); } .bar.purple > i { background: var(--purple); } .bar.blue > i { background: var(--blue); }
.bar > span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 17px; font-weight: 700; text-shadow: 0 1px 0 #000, 0 -1px 0 #000, 1px 0 0 #000, -1px 0 0 #000; line-height: 1; }
.bar.tall { height: 22px; } .bar.tall > span { font-size: 18px; }

/* home */
.arena { position: relative; border-radius: 12px; overflow: hidden; border: 3px solid var(--line); margin-bottom: 12px; }
.arena canvas { width: 100%; display: block; }
.arena .lbl { position: absolute; left: 0; right: 0; top: 0; padding: 8px 10px; background: linear-gradient(#000a, transparent); display: flex; justify-content: space-between; align-items: flex-start; }
.arena .lbl b { font-size: 29px; text-shadow: 0 2px 0 #000; display: block; } .arena .lbl small { color: #fffc; text-shadow: 0 1px 0 #000; }
.arena .prog { position: absolute; left: 10px; right: 10px; bottom: 8px; }
.squad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.capcard { border-color: var(--gold) !important; background: #3d3366 !important; }
.crownb { position: absolute; top: 4px; right: 4px; line-height: 0; }
.hcard { position: relative; background: var(--panel2); border: 3px solid var(--line); border-radius: 10px; padding: 6px 4px 6px; text-align: center; box-shadow: inset 0 -4px 0 #0003; }
.hcard img.spr { width: 64px; height: 64px; display: block; margin: 0 auto; }
.hcard .nm { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hcard .lv { position: absolute; top: 4px; right: 4px; background: var(--line); border-radius: 5px; font-size: 17px; padding: 1px 5px; font-weight: 700; }
.hcard .rar { height: 4px; border-radius: 2px; margin: 4px 6px 0; }
.hcard.locked img.spr { opacity: .55; }
.hcard .up { position: absolute; top: 4px; right: 4px; z-index: 1; background: var(--green); color: #fff; border-radius: 5px; padding: 3px 4px; line-height: 0; border: 2px solid var(--line); animation: pulse 1s infinite alternate; }
.hcard.sel { outline: 3px solid var(--gold); }
@keyframes pulse { to { transform: scale(1.12); } }
.diffs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.diffs button { padding: 9px 2px; border-radius: 8px; border: 3px solid var(--line); background: var(--panel2); font-weight: 700; font-size: 21px; box-shadow: inset 0 -3px 0 #0004; }
.diffs button.on { background: var(--dc); color: #fff; text-shadow: 0 2px 0 #0007; }
.diffinfo { display: flex; justify-content: space-between; margin-top: 8px; font-size: 20px; color: #bdb7e0; }
.chests { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cslot { aspect-ratio: 3/4; border-radius: 10px; border: 3px solid var(--line); background: #0004; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 4px; font-size: 17px; text-align: center; color: #bdb7e0; }
.cslot img { width: 48px; height: 48px; }
.cslot.ready { background: radial-gradient(circle, #ffd23f55, transparent 70%), #0004; color: var(--gold); font-weight: 700; animation: glow 1s infinite alternate; }
.cslot.ready img { animation: shake 1.2s infinite; }
.cslot .t { font-weight: 700; color: var(--text); font-size: 18px; }
@keyframes glow { to { box-shadow: 0 0 14px #ffd23f88; } }
@keyframes shake { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } 95% { transform: rotate(-5deg); } }
.supply { display: flex; align-items: center; gap: 10px; }
.supply img { width: 48px; height: 48px; }

/* lists */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 3px solid var(--line); border-radius: 10px; padding: 8px; }
.item img.ic { width: 48px; height: 48px; flex: none; }
.item.done { opacity: .55; }
.item.hot { border-color: var(--gold); background: #3d3366; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tag { display: inline-block; font-size: 18px; padding: 1px 6px; border-radius: 4px; font-weight: 700; color: #1a1030; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-size: 20px; }
.chip img { width: 16px; height: 16px; }

/* road */
.road-arena { margin: 14px 0 6px; padding: 8px 10px; border-radius: 10px; border: 3px solid var(--line); font-weight: 700; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 2px 0 #000a; }
.road-step { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-left: 4px solid #0006; margin-left: 14px; background: #ffffff08; border-radius: 0 8px 8px 0; margin-bottom: 4px; }
.road-step.reached { border-left-color: var(--gold); }
.road-step .tr { width: 72px; font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 3px; }
.road-step .tr img { width: 16px; height: 16px; }
.road-step img.ic { width: 32px; height: 32px; }
.road-here img { width: 16px; height: 16px; }

@keyframes slidel { from { transform: translateX(-120%); opacity: 0; } }
@keyframes slider { from { transform: translateX(120%); opacity: 0; } }
@keyframes vsslam { 0% { opacity: 0; transform: scale(3); } 70% { opacity: 1; transform: scale(.9); } 100% { opacity: 1; transform: scale(1); } }

.dtxt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; line-height: 1.05; }

.bar.thin { height: 8px; flex: 1; max-width: 160px; display: block; } .bar.thin i { display: block; height: 100%; }

.modal .arena.slim { margin: 0; }
/* ---- battle: the arena fills the whole screen, top and bottom float over it ---- */

#battle > .bhud, #battle > .bboard, #battle > .bpanel { position: relative; z-index: 1; }
.otl, #battle .hround, #battle .hs-row b { text-shadow: 2px 0 #0b0716, -2px 0 #0b0716, 0 2px #0b0716, 0 -2px #0b0716, 2px 2px #0b0716, -2px 2px #0b0716, 0 3px #0b0716; }
/* top: round on the left, score in the middle, timer on the right, all straight on the arena */
#battle .bhud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; min-height: 0; padding: calc(4px + var(--sat)) 8px 2px; background: none; border: 0; }
#battle .hleft { display: flex; align-items: center; gap: 5px; min-width: 0; }

#battle .hround { display: flex; flex-direction: column; line-height: .95; min-width: 0; white-space: nowrap; }
#battle .hround b { font-size: 22px; } #battle .hround small { font-size: 18px; color: var(--gold); }
#battle .hscore { justify-self: center; background: #0b0716a8; border: 2px solid #ffffff26; border-radius: 12px; padding: 0 8px 2px; }

#battle .bleft { position: relative; flex: 1; min-width: 0; height: 58px; }

#battle .bbtns2 { flex: none; display: flex; gap: 6px; margin: 0; }

#battle .binfo { position: absolute; left: 0; right: 0; bottom: 0; transform: none; width: auto; height: auto; min-height: 58px; background: #140c22f0; border: 2px solid #ffffff40; border-radius: 12px; padding: 5px 8px; box-shadow: 0 3px 0 #0008; }

#battle .abig-h b { font-size: 21px; } #battle .abig-h .tag.sm { font-size: 13px; }
#battle .abig-t { font-size: 17px; margin-top: 1px; -webkit-line-clamp: 5; }
#battle .bpanel .bcap { position: absolute; left: 0; right: 0; bottom: 0; top: auto; height: auto; margin: 0; background: none; justify-content: flex-end; gap: 3px; }

/* resource flood */

/* ---- bench + slots (setup) ---- */
#battle .bbench { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; border-radius: 12px; transition: background .15s; }
#battle .bbench.hidden { display: none; }

.bslots { align-self: flex-start; display: flex; align-items: center; gap: 5px; font-size: 17px; background: #0b0716c8; border: 2px solid #ffffff30; border-radius: 9px; padding: 0 8px; line-height: 1.25; }
.bslots b { font-size: 19px; } .bslots .pp { display: flex; gap: 3px; } .bslots .pp i { width: 10px; height: 10px; background: #ffd23f; border: 2px solid #0b0716; display: block; }

.cst span { transform: rotate(-45deg); line-height: 1; }

body[data-tut=bench] .bcard.fit { animation: tglow .8s infinite; }
#battle .bpanel:not(.solo) .bbtns2 .btn.big { font-size: 26px; padding: 8px 11px; }
.hcard .cst, .pcard .cst { top: 6px; left: 6px; }
.deckrow .dk .cst.sm { top: -6px; left: -6px; width: 17px; height: 17px; font-size: 13px; }
.cst.in { position: relative; top: auto; left: auto; display: inline-flex; width: 15px; height: 15px; font-size: 12px; margin: 0 6px 0 2px; vertical-align: middle; }
.cst.in.big { width: 20px; height: 20px; font-size: 15px; margin-right: 8px; }
.tag.costchip { display: inline-flex; align-items: center; background: #3a2f63; color: #fff; border: 2px solid #ffd23f; font: inherit; font-size: inherit; cursor: pointer; }
.tag.costchip.sel { outline: 2px solid #fff; }
/* fixed-height top bar and bottom row, so the board never shifts between phases */
#battle .bhud { height: calc(50px + var(--sat)); flex: none; }
#battle .bpanel { height: calc(91px + var(--sab) * .55); flex: none; }
/* iOS Home Screen app: stretch the full-screen layers to the real screen when the viewport comes up short (see fixViewport) */
/* backdrop overhangs the screen (shake / zoom), board may grow past its box during the slow-mo zoom; top bar and bottom row stay on top */

#battle { overflow: hidden; }
#battle > .bboard { overflow: visible; z-index: 1; }
#battle > .bhud, #battle > .bpanel { z-index: 2; }
#bbg { transition: transform .3s cubic-bezier(.2,.8,.3,1); }
/* ---- Rift Orbs (hero cost) ---- */

.orbs img { display: block; width: 13px; height: 13px; }
.orbs.under { display: flex; justify-content: center; gap: 2px; margin-top: 3px; }
.orbs.under img { width: 16px; height: 16px; }

.bslots { gap: 1px; padding: 2px 6px; }
.bslots img.sk { width: 17px; height: 17px; display: block; }

@keyframes orbpop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
@keyframes orbnew { 0% { transform: scale(0); } 35% { transform: scale(1.6); filter: drop-shadow(0 0 6px #9fe8ff); } 100% { transform: scale(1); } }
.orbfly { position: fixed; z-index: 160; width: 16px; height: 16px; pointer-events: none; filter: drop-shadow(0 0 3px #5fb8ff); }
.bcard.pop { animation: orbpop .25s ease-out; }
.tag.costchip { border-color: #4fa3ff; }

.st2 { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; padding: 0; border-radius: 50%; background: #2a2244; border: 4px solid #6a6490; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 25px; font-weight: 700; color: #bdb5e0; z-index: 2; box-shadow: 0 4px 0 #0008; cursor: pointer; }

        if (!u.alive || stunned(s, u)) return;
        pushEv(ev2, { t: 'laser', uid: u.uid, x: u.x, y0: u.y, y1: fwd < 0 ? -1 : BH, color: col });
        const hitList = laneFoes(s, u); hitList.forEach(e => hit(s, u, e, 2, ev2, 'abil')); if (hitList.length >= 3) s.feats[u.side].laser3 = 1;
        cap(ev2, u, hitList.length ? `hit ${plural(hitList.length, 'enemy')} in the lane` : 'the lane was empty');
      }); return;
    case 'bomb': { cast(); const tx = u.x, ty = Math.max(0, Math.min(BH - 1, u.y + fwd * 3));
      pushEv(ev, { t: 'lob', uid: u.uid, x: tx, y: ty, color: '#2a2438', bomb: true, dur: 550 });
      later(s, 0.55, ev2 => {
        const tiles = []; for (let y = ty - 1; y <= ty + 1; y++) for (let x = tx - 1; x <= tx + 1; x++) if (inB(x, y)) tiles.push({ x, y });
        pushEv(ev2, { t: 'blast', tiles, color: '#ff8a2a', boom: true });
        const hl = around(s, u, tx, ty, 1); hl.forEach(e => hit(s, u, e, 1, ev2, 'abil'));

      }); return; }
    case 'dash': case 'batform': {
      const pool = ab === 'dash' ? foesOf(s, u).sort((a, b) => cheb(u.x, u.y, b.x, b.y) - cheb(u.x, u.y, a.x, a.y) || (a.uid < b.uid ? -1 : 1))
        : foesOf(s, u).sort((a, b) => a.hp - b.hp || cheb(u.x, u.y, a.x, a.y) - cheb(u.x, u.y, b.x, b.y));
      const back = u.side === 0 ? -1 : 1;
      for (const f of pool) {
        let spot = null;
        for (const [dx, dy] of [[0, back], [1, back], [-1, back], [1, 0], [-1, 0], [0, -back], [1, -back], [-1, -back]]) if (free(s, f.x + dx, f.y + dy)) { spot = [f.x + dx, f.y + dy]; break; }
        if (!spot) continue;
        cast(); pushEv(ev, { t: 'leap', uid: u.uid, at: s.t, bat: ab === 'batform' }); placeAt(u, spot[0], spot[1], s, 0.45); u.tgt = f; u.retgt = t0 + 1; u.nextAtk = t0 + 0.2;
        if (ab === 'dash') later(s, 0.45, ev2 => { if (u.alive && f.alive) { pushEv(ev2, { t: 'lunge', uid: u.uid, tuid: f.uid }); hit(s, u, f, 1, ev2, 'abil'); cap(ev2, u, `struck ${HERO[f.hid].name} from behind`); } });

        return;
      }
      return; }
    case 'rally': { cast(); const fr = friendsOf(s, u).filter(a => a !== u && cheb(u.x, u.y, a.x, a.y) <= 1);
      fr.forEach(a => { a.st.shield = Math.max(a.st.shield, 2); a.st.shieldT = 999; pushEv(ev, { t: 'status', uid: a.uid, kind: 'shield' }); });
      cap(ev, u, fr.length ? `shielded ${plural(fr.length, 'friend')}` : 'nobody was next to him'); return; }
    case 'cannon': { cast(); const e = laneFoes(s, u)[0];
      pushEv(ev, { t: 'atk', uid: u.uid, tuid: e ? e.uid : null, x1: u.x, y1: fwd < 0 ? 0 : BH - 1, ranged: true, look: 'cannon', color: '#2a2438', d: 0.3 });
      later(s, 0.3, ev2 => { if (e && e.alive) { zap(s, u, e, 3, ev2); cap(ev2, u, `blasted ${HERO[e.hid].name} for 3`); } else cap(ev2, u, 'the lane was empty'); }); return; }
    case 'hook': { const e = laneFoes(s, u).slice(-1)[0]; cast();
      if (!e) { cap(ev, u, 'nobody in her lane'); return; }
      const dest = free(s, u.x, u.y + fwd) ? [u.x, u.y + fwd] : nearestFree(s, u.x, u.y + fwd);
      pushEv(ev, { t: 'hook', uid: u.uid, tuid: e.uid, color: '#c9a46a' });
      if (dest && cheb(dest[0], dest[1], e.x, e.y) > 0) { placeAt(e, dest[0], dest[1], s, 0.35); stun(s, e, 0.35, null); }
      cap(ev, u, `hooked ${HERO[e.hid].name} over`); return; }
    case 'curse': { const e = closestFoes(s, u, 1)[0]; if (!e) return; cast(); e.st.vulnT = t0 + 5; pushEv(ev, { t: 'status', uid: e.uid, kind: 'curse' }); cap(ev, u, `cursed ${HERO[e.hid].name}: +1 from every hit`); return; }
    case 'missiles': { const list = closestFoes(s, u, 3); if (!list.length) return; cast();
      list.forEach((e, i) => { pushEv(ev, { t: 'atk', uid: u.uid, tuid: e.uid, ranged: true, look: 'missile', color: '#ff8a2a', d: 0.45 + i * 0.12 }); later(s, 0.45 + i * 0.12, ev2 => { if (e.alive) zap(s, u, e, 2, ev2); }); });
      cap(ev, u, `fired at ${plural(list.length, 'enemy')}`); return; }
    case 'slowtime': { cast(); const fs = foesOf(s, u); fs.forEach(e => { e.st.slowT = t0 + 4; pushEv(ev, { t: 'status', uid: e.uid, kind: 'slow' }); }); pushEv(ev, { t: 'screen', kind: 'slowtime' }); cap(ev, u, `slowed all ${plural(fs.length, 'enemy')}`); return; }
    case 'mine': { const my = u.y + fwd * 2; if (!inB(u.x, my) || isObs(s, u.x, my)) return; cast(); s.mines.push({ x: u.x, y: my, side: u.side, owner: u.uid }); pushEv(ev, { t: 'mine', x: u.x, y: my, side: u.side }); cap(ev, u, 'planted a mine'); return; }
    case 'drone': cast(); s.drones.push({ side: u.side, owner: u.uid, next: t0 + 2 }); pushEv(ev, { t: 'drone', uid: u.uid }); cap(ev, u, 'launched a healing drone'); return;
    case 'quickdraw': { const e = closestFoes(s, u, 1)[0]; if (!e) return; cast();
      pushEv(ev, { t: 'atk', uid: u.uid, tuid: e.uid, ranged: true, look: 'bullet', color: '#ffd23f', d: 0.08 }); later(s, 0.08, ev2 => { if (e.alive) { zap(s, u, e, 3, ev2); cap(ev2, u, `shot ${HERO[e.hid].name} for 3`); } }); return; }
    case 'feast': { cast(); const fr = friendsOf(s, u); fr.forEach(a => { a.maxHp += 2; a.hp += 2; pushEv(ev, { t: 'heal', uid: a.uid, amt: 2 }); }); cap(ev, u, `gave ${plural(fr.length, 'friend')} +2 health`); return; }
    case 'avalanche': { cast(); pushEv(ev, { t: 'lanefx', uid: u.uid, x: u.x, y0: u.y, y1: fwd < 0 ? -1 : BH, color: '#e8f6ff', kind: 'snow' });
      later(s, 0.35, ev2 => { const hl = laneFoes(s, u); hl.forEach(e => { zap(s, u, e, 1, ev2); e.st.slowT = t0 + 4; pushEv(ev2, { t: 'status', uid: e.uid, kind: 'slow' }); }); cap(ev2, u, hl.length ? `slowed ${plural(hl.length, 'enemy')}` : 'the lane was empty'); }); return; }
    case 'nitro': cast(); u.st.hasteT = t0 + 4; u.st.fastT = t0 + 4; pushEv(ev, { t: 'status', uid: u.uid, kind: 'haste' }); cap(ev, u, 'is twice as fast for 4s'); return;
    case 'cauldron': case 'firewall': {
      const cy = u.y + fwd * 2; if (!inB(u.x, cy)) return; cast();
      const tiles = []; if (ab === 'cauldron') { for (let y = cy - 1; y <= cy + 1; y++) for (let x = u.x - 1; x <= u.x + 1; x++) if (inB(x, y)) tiles.push(y * BW + x); }

    case 'meteor': { const e = foesOf(s, u).sort((a, b) => b.hp - a.hp || (a.uid < b.uid ? -1 : 1))[0]; if (!e) return; cast();
      pushEv(ev, { t: 'meteor', tuid: e.uid, dur: 0.7 }); later(s, 0.7, ev2 => { if (e.alive) { pushEv(ev2, { t: 'blast', tiles: [{ x: e.x, y: e.y }], color: '#ff8a2a', boom: true }); zap(s, u, e, 3, ev2); cap(ev2, u, `crushed ${HERO[e.hid].name} for 3`); } }); return; }
    case 'warcry': { cast(); const fr = friendsOf(s, u).filter(a => a !== u && cheb(u.x, u.y, a.x, a.y) <= 1); fr.forEach(a => { a.bonus++; pushEv(ev, { t: 'status', uid: a.uid, kind: 'rage' }); }); cap(ev, u, fr.length ? `${plural(fr.length, 'friend')} got +1 damage` : 'nobody heard it'); return; }
    case 'clone': { const sp = [[1, 0], [-1, 0], [0, -fwd], [0, fwd], [1, -fwd], [-1, -fwd]].map(([dx, dy]) => [u.x + dx, u.y + dy]).find(([x, y]) => free(s, x, y)); if (!sp) return; cast();
      const c = makeUnit(s, u.uid + 'c', u.hid, u.side, null, sp[0], sp[1], { hp: 2, atk: 1, clone: true, i: 3 }); c.fx = u.x; c.fy = u.y; c.mt0 = 0; c.mt1 = 0.3; s.units.push(c);

  }
}

// ----- charge abilities: return true if cast -----
function castAbility(s, u, ev) {

  const shot = (tg, look, color, dl) => pushEv(ev, { t: 'atk', uid: u.uid, tuid: tg.uid, ranged: true, look, color, d: dl || 0.15 });
  const nm = e => HERO[e.hid].name;
  switch (ab) {

      const moved = t.alive && shove(s, t, t.x + Math.sign(t.x - u.x), t.y + Math.sign(t.y - u.y), ev); cap(ev, u, moved ? `bashed ${nm(t)} back` : `bashed ${nm(t)}`); return true; }

      list.forEach(e => { e.st.tauntUid = u.uid; e.st.tauntT = s.t + 3; e.tgt = u; e.retgt = s.t + 3; pushEv(ev, { t: 'status', uid: e.uid, kind: 'taunt' }); });
      if (list.length >= 4) s.feats[u.side].tauntAll = 1;

    case 'boulder': { const e = t && d <= 2 ? t : closestFoes(s, u, 1).find(x => cheb(u.x, u.y, x.x, x.y) <= 2); if (!e) return false; cast();
      pushEv(ev, { t: 'atk', uid: u.uid, tuid: e.uid, ranged: true, look: 'boulder', color: '#9a8f86', d: 0.3 }); later(s, 0.3, ev2 => { if (e.alive) { hit(s, u, e, 2, ev2, 'abil'); cap(ev2, u, `hit ${nm(e)} with a boulder`); } }); return true; }
    case 'quake': { const list = around(s, u, u.x, u.y, 1); if (!list.length) return false; cast(); pushEv(ev, { t: 'quake', uid: u.uid });
      list.forEach(e => stun(s, e, 2, ev)); cap(ev, u, `stunned ${plural(list.length, 'enemy')}`); return true; }
    case 'wrap': case 'freeze': { if (d > Math.max(2, u.rng)) return false; cast(); shot(t, ab === 'wrap' ? 'whip' : 'ice', ab === 'wrap' ? '#ece0c4' : '#bfe8ff', 0.1);
      stun(s, t, 2, ev, ab === 'wrap' ? 'wrap' : 'freeze'); cap(ev, u, `${ab === 'wrap' ? 'wrapped' : 'froze'} ${nm(t)} for 2s`); return true; }
    case 'sandstorm': { const list = around(s, u, u.x, u.y, 2); if (!list.length) return false; cast(); pushEv(ev, { t: 'ringfx', uid: u.uid, r: 2, color: '#e0c98a' });
      list.forEach(e => { zap(s, u, e, 1, ev); e.st.slowT = s.t + 3; pushEv(ev, { t: 'status', uid: e.uid, kind: 'slow' }); }); cap(ev, u, `slowed ${plural(list.length, 'enemy')}`); return true; }
    case 'chomp3': { if (d > 1) return false; cast(); for (let i = 0; i < 3; i++) later(s, i * 0.18, ev2 => { if (u.alive && t.alive) { pushEv(ev2, { t: 'atk', uid: u.uid, tuid: t.uid, look: 'chomp', color: '#ffffff', d: 0.05 }); hit(s, u, t, 0, ev2, 'abil'); } });

    case 'mend': { const fr = friendsOf(s, u); if (!fr.some(a => a.hp < a.maxHp)) return false; cast(); pushEv(ev, { t: 'ringfx', uid: u.uid, r: 9, color: '#5fd068' }); fr.forEach(a => heal(s, a, 1, ev)); cap(ev, u, 'healed every friend for 1'); return true; }
    case 'haste': { if (!foesOf(s, u).some(e => cheb(u.x, u.y, e.x, e.y) <= 3)) return false; cast(); const fr = friendsOf(s, u).filter(a => cheb(u.x, u.y, a.x, a.y) <= 2);
      fr.forEach(a => { a.st.hasteT = s.t + 3; pushEv(ev, { t: 'status', uid: a.uid, kind: 'haste' }); }); cap(ev, u, `sped up ${plural(fr.length, 'friend')}`); return true; }
    case 'overclock': { if (!t || d > u.rng) return false; cast(); u.st.hasteT = s.t + 3; pushEv(ev, { t: 'status', uid: u.uid, kind: 'haste' }); cap(ev, u, 'fires twice as fast for 3s'); return true; }
    case 'heal': { const h = mostHurt(s, u, 1).find(a => a.maxHp - a.hp >= 2); if (!h) return false; cast(); pushEv(ev, { t: 'beam', uid: u.uid, tuid: h.uid, color: '#5fd068' }); heal(s, h, 3 + u.m.abil, ev); cap(ev, u, `healed ${nm(h)}`); return true; }
    case 'bubble': { const h = mostHurt(s, u, 1).find(a => !(a.st.shield > 0 && a.st.shieldT > s.t)); if (!h || !foesOf(s, u).length) return false; cast(); pushEv(ev, { t: 'beam', uid: u.uid, tuid: h.uid, color: '#4ff0ff' });

    case 'scrap': case 'fireball': case 'pepper': { if (!t || d > Math.max(3, u.rng)) return false; cast();
      const look = ab === 'fireball' ? 'fireball' : ab === 'pepper' ? 'lob' : 'scrap', col = ab === 'pepper' ? '#ff4f2a' : ab === 'fireball' ? '#ff8a2a' : '#8a8a9a';

      let spot = free(s, bx, by) ? [bx, by] : null; if (!spot) for (const [dx, dy] of DIR8) if (free(s, t.x + dx, t.y + dy)) { spot = [t.x + dx, t.y + dy]; break; }
      if (!spot) return false; cast(); pushEv(ev, { t: 'leap', uid: u.uid, at: s.t }); placeAt(u, spot[0], spot[1], s, 0.3);
      later(s, 0.3, ev2 => { if (u.alive && t.alive) { pushEv(ev2, { t: 'lunge', uid: u.uid, tuid: t.uid }); hit(s, u, t, 2, ev2, 'abil'); cap(ev2, u, `backstabbed ${nm(t)}`); } }); return true; }
    case 'lasso': { if (!t || d > 3) return false; cast(); pushEv(ev, { t: 'hook', uid: u.uid, tuid: t.uid, color: '#c9a46a' });
      const px = t.x - Math.sign(t.x - u.x), py = t.y - Math.sign(t.y - u.y); if (d >= 2) shove(s, t, px, py, ev, 0.25); stun(s, t, 1, ev); cap(ev, u, `lassoed ${nm(t)}`); return true; }
    case 'snack': { const list = mostHurt(s, u, 2); if (!list.length) return false; cast(); list.forEach(h => { pushEv(ev, { t: 'atk', uid: u.uid, tuid: h.uid, ranged: true, look: 'lob', color: '#fff3d6', d: 0.2 }); later(s, 0.2, ev2 => heal(s, h, 2 + u.m.abil, ev2)); });
      cap(ev, u, `fed ${list.map(nm).join(' and ')}`); return true; }
    case 'shuriken': { const list = closestFoes(s, u, 3); if (!list.length) return false; cast(); list.forEach(e => { shot(e, 'star', '#e8eef5', 0.15); later(s, 0.15, ev2 => { if (e.alive) zap(s, u, e, 1, ev2); }); }); cap(ev, u, `threw stars at ${plural(list.length, 'enemy')}`); return true; }
    case 'smoke': { if (!foesOf(s, u).some(e => e.tgt === u)) return false; cast(); u.st.vanishT = s.t + 2; pushEv(ev, { t: 'smoke', uid: u.uid });
      s.units.forEach(o => { if (o.tgt === u) o.retgt = 0; }); cap(ev, u, 'vanished in smoke'); return true; }
    case 'turbo': { if (d > 1) return false; cast(); pushEv(ev, { t: 'lunge', uid: u.uid, tuid: t.uid }); hit(s, u, t, 2, ev, 'abil'); cap(ev, u, `turbo-punched ${nm(t)}`); return true; }
    case 'chain': { if (!t || d > Math.max(2, u.rng)) return false; cast(); const extra = foesOf(s, u).filter(e => e !== t && cheb(t.x, t.y, e.x, e.y) <= 2).sort((a, b) => cheb(t.x, t.y, a.x, a.y) - cheb(t.x, t.y, b.x, b.y)).slice(0, 2);
      pushEv(ev, { t: 'chain', uids: [u.uid, t.uid].concat(extra.map(e => e.uid)) }); hit(s, u, t, 1, ev, 'abil'); extra.forEach(e => zap(s, u, e, 1, ev)); cap(ev, u, `zapped ${plural(1 + extra.length, 'enemy')}`); return true; }
    case 'frog': { if (!t || d > Math.max(2, u.rng)) return false; cast(); shot(t, 'hex', '#7dff6b', 0.15); stun(s, t, 2, ev, 'frog'); cap(ev, u, `turned ${nm(t)} into a frog`); return true; }
    case 'drain': { if (!t || d > u.rng) return false; cast(); shot(t, 'hex', '#ff3b5c', 0.15); hit(s, u, t, 1, ev, 'abil'); const h = mostHurt(s, u, 1)[0]; if (h) { pushEv(ev, { t: 'beam', uid: t.uid, tuid: h.uid, color: '#ff3b5c' }); heal(s, h, 2 + u.m.abil, ev); }
      cap(ev, u, h ? `drained ${nm(t)} to heal ${nm(h)}` : `drained ${nm(t)}`); return true; }
    case 'zerog': { if (!t || d > Math.max(2, u.rng)) return false; cast(); const list = around(s, u, t.x, t.y, 1); list.forEach(e => stun(s, e, 2, ev, 'float')); cap(ev, u, `floated ${plural(list.length, 'enemy')}`); return true; }
    case 'blackhole': { if (!t || d > Math.max(2, u.rng)) return false; cast(); const list = around(s, u, t.x, t.y, 2); pushEv(ev, { t: 'hole', x: t.x, y: t.y });
      list.filter(e => e !== t).sort((a, b) => cheb(t.x, t.y, a.x, a.y) - cheb(t.x, t.y, b.x, b.y)).forEach(e => { if (cheb(t.x, t.y, e.x, e.y) > 1) shove(s, e, e.x - Math.sign(e.x - t.x), e.y - Math.sign(e.y - t.y), ev, 0.3); });
      list.forEach(e => zap(s, u, e, 1, ev)); cap(ev, u, `pulled in ${plural(list.length, 'enemy')}`); return true; }

const AI_CFG = {

// ----- iOS Home Screen app fix -----
// WebKit bug (iOS 26.1+, back again in 26.5 and 27): a Home Screen app can't draw in a band at the bottom of the
// screen as tall as the status bar. iOS fills it with the page background, and nothing on the page can reach it.
// (Sizing the app to the full screen, the old fix, just pushed the bottom of every screen under that band.)
// So lay out in the space we really get, colour the band like the tab bar so it reads as part of it,
// and drop the home-indicator padding, since the band already sits under the home indicator.
function fixViewport() {
  const root = document.documentElement;
  const st = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const portrait = innerHeight >= innerWidth, sh = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const gap = st ? Math.round(sh - innerHeight) : 0, band = gap >= 20 && gap <= 120;
  root.classList.toggle('vband', band);
  if (band) root.style.setProperty('--sab', '0px'); else root.style.removeProperty('--sab');
}

  tutMark(null); tutGlow('');

  // ---- the fight ----
  coach(`Green bar = health, purple bar = ability charging. <b>Tap any hero</b> to see who it's going after.`, { auto: 4500 });
  const r1 = await Promise.race([tutWait('taunt', e => e.uid && e.uid[0] === 'p'), tutWait('roundOver').then(() => null)]);
  if (!alive()) return;
  if (r1) {
    const n = r1.tuids.length;
    coach(`${icon('i_taunt', 'ii')} <b>Taunt!</b> ${n > 1 ? `All ${n} enemies have to attack Bruno now` : 'The enemy has to attack Bruno now'}, so his friends get free hits.`, { auto: 4000 });
    await tutWait('roundOver');
  }
  if (!alive()) return;

  // ---- round 2: Rift Orbs and the faded enemies ----
  await tutWait('setup');
  if (!alive()) return;
  tutGlow('bench');
  await coach(`You get <b>1 more Rift Orb</b> every round. Each hero costs the blue orbs on its card. <b>Tap a hero on the bench</b> to bring it in!`, { wait: tutWait('benchAdd'), noSkip: true });
  if (!alive()) return;
  tutGlow('');
  const gh = M.prev && M.prev[1] && M.prev[1].units[0];
  if (gh) tutMark({ x: gh.x, y: gh.y }); tutGlow('fight');
  await coach(`<b>Faded red heroes</b> show where the enemy stood last round. Line Zip's laser up with one, then <b>FIGHT!</b>`, { wait: tutWait('fight') });
  if (!alive()) return;
  tutMark(null); tutGlow('');
  coach(`Win ${M.setup.toWin} rounds to win the match.`, { auto: 3000 });

  // ---- results ----
  const res = await tutWait('matchDone');
  if (!alive()) return;
  if (res && res.fled) { TUT = null; coachHide(); return; }
  await coach(res && res.win ? `You won! In real matches, every win puts a <b>chest</b> on your shelf.` : `Close one! In real matches, every win puts a <b>chest</b> on your shelf.`, { wait: tutWait('home'), noSkip: true });
  if (!alive()) return;

  // ---- open a chest ----
  if (TUT.first && S.keys > 0 && S.shelf.length) {
    const sh = $('.shelf'); if (sh) sh.scrollIntoView({ block: 'center', behavior: 'smooth' });
    tutGlow('shelf');
    await coach(`Chests open with ${icon('i_key', 'ii')} <b>keys</b>. You get a new key every 5 hours. <b>Tap a chest</b> to open it!`, { wait: tutWait('chestDone'), pos: 'athome' });
    if (!alive()) return;
    tutGlow('');
  }
  await coach(`${icon('i_htrophy', 'ii')} <b>Hero trophies</b> unlock new heroes and abilities. Equip abilities in the <b>Heroes</b> tab. Good luck out there!`, { next: "Let's go", pos: 'athome', noSkip: true });
  TUT = null; coachHide();
  const sc = $('#screen'); if (sc) sc.scrollTop = 0;
}

boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
